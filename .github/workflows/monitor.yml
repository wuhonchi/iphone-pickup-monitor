name: iphone-pickup-monitor

# cron-job.org dispatches this every minute. Each dispatched run owns the NEXT wall-clock minute
# and checks every 5 s (07:00-09:30 HKT) or once (other times). Runs are NOT queued: the next one
# warms up while the current one is still checking, so there is no hand-off gap.
# The schedule below is only a slow fallback in case cron-job.org stops.
on:
  workflow_dispatch:
    inputs:
      selftest:
        description: "Send a test Telegram using an in-stock stand-in model"
        type: boolean
        default: false
      burst_window:
        description: "Override 5-second window HH:MM-HH:MM HKT (testing only)"
        type: string
        default: ""
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write  # commit .state.json / .blocked back so runs remember what was alerted
  actions: read    # read this run's creation time (minute ownership)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      # Needed before the check step: push_blocked() commits .blocked from inside monitor.py.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check Apple HK pickup
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          # schedule (*/30 fallback, --cron): never burst, so it does a single pass and cannot overlap
          # the minute-owner runs for 270 s. start == end means "never" (monitor.in_burst_window).
          BURST_WINDOW: ${{ github.event_name == 'schedule' && '00:00-00:00' || (inputs.burst_window || vars.BURST_WINDOW || '07:00-09:30') }}
        run: python3 monitor.py ${{ inputs.selftest && '--selftest' || (github.event_name == 'workflow_dispatch' && '--minute' || '--cron') }}

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in .state.json .blocked; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "monitor state $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -X theirs --quiet && git push && exit 0; sleep 2; done
          echo "state push failed after 3 tries"
