name: iphone-pickup-monitor

# Triggered every few minutes by cron-job.org via the GitHub API (workflow_dispatch).
# The schedule below is only a slow fallback in case cron-job.org stops.
on:
  workflow_dispatch:
    inputs:
      selftest:
        description: "Send a test Telegram using an in-stock stand-in model"
        type: boolean
        default: false
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write  # commit .state.json / .blocked back so runs remember what was alerted

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check Apple HK pickup
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitor.py ${{ inputs.selftest && '--selftest' || '--cron' }}

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .state.json .blocked 2>/dev/null || true
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "monitor state $(date -u +%FT%TZ)"
          git pull --rebase --quiet && git push
